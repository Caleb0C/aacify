[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aacify"
version = "0.1.0"
description = "Replace video audio streams with AAC using FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
aacify = "aacify:main"

[tool.setuptools]
py-modules = ["aacify"]